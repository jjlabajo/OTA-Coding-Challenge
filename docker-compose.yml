
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile 
    container_name: ota_laravel_app
    restart: unless-stopped
    working_dir: /var/www/html 
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - ota_network
    depends_on:
      - db 
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE} 
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_NAME="${APP_NAME:-Laravel}"
      - APP_ENV="${APP_ENV:-local}"
      - APP_DEBUG="${APP_DEBUG:-true}"
      - APP_URL="${APP_URL:-http://localhost}"
    ports:
      - "8000:8000"

  db:
    image: mysql:8.0
    container_name: ota_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "33066:3306"
    networks:
      - ota_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ota_nextjs_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ota_network

networks:
  ota_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  backend_vendor:
    driver: local